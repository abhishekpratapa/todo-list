<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in to Todos</title>
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Todos">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login">
  <main>
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5"/></svg>
    </span>
    <h1>Todos</h1>
    <p class="lead">Enter the access token from your Mac to use your todo list on this device.</p>

    <form id="signin">
      <!-- Lets a password manager file the token under a name. -->
      <input type="text" name="username" value="Todos" autocomplete="username" hidden>
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <button class="btn primary" type="submit" id="submit">Sign in</button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <p class="hint">On your Mac, open Todos and choose <b>Todos → Remote Access → Copy Access Token</b>.</p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
